<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Will you be my Valentine? ❤️</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #fff0f5, #ffe4e1);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .container {
      text-align: center;
      background: white;
      padding: clamp(1.5rem, 6vw, 3.5rem) clamp(1.5rem, 5vw, 4rem);
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(255, 105, 180, 0.25);
      width: 100%;
      max-width: 90vw;
      max-width: min(520px, 90vw);
      position: relative;
      min-height: 50vh;
      max-height: 95vh;
      overflow: hidden;
    }

    h1 {
      color: #e91e63;
      font-size: clamp(1.8rem, 6vw, 2.4rem);
      margin: 0 0 1.5rem;
      line-height: 1.2;
    }

    .cat {
      font-size: clamp(3.5rem, 12vw, 5.5rem);
      margin-bottom: 1rem;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: clamp(1.2rem, 5vw, 3rem);
      margin: 2rem 0;
      position: relative;
      min-height: 80px;
      flex-wrap: wrap;
    }

    button {
      font-size: clamp(1.1rem, 4.5vw, 1.35rem);
      padding: clamp(0.9rem, 4vw, 1.1rem) clamp(1.8rem, 6vw, 3.2rem);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s;
      touch-action: manipulation;
      min-width: 110px;
      min-height: 54px; /* better touch target */
      user-select: none;
    }

    #yes {
      background: #ff4081;
      color: white;
      font-weight: bold;
      box-shadow: 0 6px 20px rgba(255, 64, 129, 0.4);
    }

    #yes:hover,
    #yes:active {
      transform: scale(1.08);
      background: #f50057;
    }

    #no {
      background: #e0e0e0;
      color: #444;
    }

    #no:hover,
    #no:active {
      background: #d0d0d0;
    }

    #no.moving {
      position: absolute;
      z-index: 10;
      min-width: 100px;
      min-height: 54px;
    }

    .message {
      margin-top: 1.5rem;
      color: #e91e63;
      font-size: clamp(1rem, 3.8vw, 1.15rem);
      font-weight: 500;
      min-height: 2em;
      line-height: 1.4;
    }

    @media (max-width: 500px) {
      .container {
        padding: 1.5rem 1.2rem;
      }
      .buttons {
        gap: 1.5rem;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="cat">ฅ^•ﻌ•^ฅ ♥</div>
  <h1>damini will you be my valentine?</h1>

  <div class="buttons">
    <button id="yes">Yes</button>
    <button id="no">No</button>
  </div>

  <div class="message" id="message"></div>
</div>

<script>
const noBtn = document.getElementById('no');
const yesBtn = document.getElementById('yes');
const message = document.getElementById('message');
const container = document.querySelector('.container');

const shyReplies = [
  "wait... are you sure? 🥺",
  "please think again... 💔",
  "my heart can't take this 😿",
  "nooo come back... 🥹",
  "you're breaking me... 💘",
  "one more chance? 🥰",
  "you're too fast for me...",
  "this is cruelty 😭",
  "okay I'm moving countries now",
  "...still love you though ❤️"
];

let attempt = 0;
let isMoving = false;

function moveNoButton() {
  if (!isMoving) {
    noBtn.classList.add('moving');
    isMoving = true;
  }

  const contRect = container.getBoundingClientRect();

  // Safe area — keep button fully inside container
  const padding = 20;
  const maxX = contRect.width - noBtn.offsetWidth - padding * 2;
  const maxY = contRect.height - noBtn.offsetHeight - padding * 2;

  let newX = padding + Math.random() * maxX;
  let newY = padding + Math.random() * maxY;

  // Early attempts → more central
  if (attempt < 5) {
    newX = contRect.width * 0.15 + Math.random() * contRect.width * 0.7;
    newY = contRect.height * 0.15 + Math.random() * contRect.height * 0.6;
  }

  noBtn.style.left = newX + 'px';
  noBtn.style.top  = newY + 'px';
}

noBtn.addEventListener('click', (e) => {
  e.preventDefault();
  attempt++;
  moveNoButton();

  // Yes grows slowly
  const grow = 1 + attempt * 0.06;
  yesBtn.style.transform = `scale(${Math.min(grow, 1.5)})`;  

  // Sad messages
  if (attempt - 1 < shyReplies.length) {
    message.textContent = shyReplies[attempt - 1];
  } else {
    message.textContent = "you're really committed to clicking No huh... 😭";
  }
});

// Also move on hover/touch (after first attempt)
noBtn.addEventListener('mouseover', () => {
  if (attempt >= 1) moveNoButton();
});

noBtn.addEventListener('touchstart', (e) => {
  if (attempt >= 1) {
    e.preventDefault(); // helps prevent accidental scroll
    moveNoButton();
  }
}, { passive: false });

yesBtn.addEventListener('click', () => {
  document.body.innerHTML = `
    <div style="
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      background:linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      color:white;
      font-size: clamp(2.2rem, 8vw, 3.8rem);
      text-align:center;
      padding: 2rem 1.5rem;
    ">
      <div style="font-size: clamp(6rem, 25vw, 10rem); margin-bottom:1rem;">💖💞💝</div>
      <div>YAYYYYYYYYY!!! 🥰🥰🥰</div>
      <div style="font-size: clamp(1.8rem, 6vw, 2.4rem); margin:2rem 0 1rem;">
        I LOVE YOU DAMINI ❤️
      </div>
      <div style="font-size: clamp(1.3rem, 4.5vw, 1.7rem); opacity:0.9;">
        (took you long enough 😏)
      </div>
    </div>
  `;
});
</script>

</body>
</html>
